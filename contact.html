<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      overflow:hidden;
    }

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    .left{
      width:40%;
      background:#f5efe8;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:60px;
    }

    .left h1{
      font-size:70px;
      margin-bottom:20px;
      color:#4d5a4d;
    }

    .left p{
      font-size:20px;
      margin-bottom:30px;
      color:#555;
      line-height:1.5;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .card h2{
      margin-bottom:10px;
      color:#444;
    }

    .card p{
      margin:0;
      font-size:18px;
    }

    .right{
      width:60%;
      background-image:url("images/contact-bg.png");
      background-size:cover;
      background-position:center;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="left">

      <h1>Contact Me</h1>

      <p>
        Feel free to reach out for questions,
        collaborations or opportunities.
      </p>

      <div class="card">
        <h2>Email</h2>
        <p>sarrthak.chauhan016@nmims.in</p>
      </div>

      <div class="card">
        <h2>Instagram</h2>
        <p>@Shady_prodigyy</p>
      </div>

    </div>

    <div class="right"></div>

  </div>

</body>
</html>

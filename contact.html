<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach Out — Sarrthak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080810;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text-primary: #f0f0f5;
    --text-secondary: rgba(240,240,245,0.45);
    --text-tertiary: rgba(240,240,245,0.25);
    --purple: #b48ef7;
    --blue: #7eb3f5;
    --pink: #f07ab8;
    --glow-purple: rgba(180,142,247,0.15);
    --glow-blue: rgba(126,179,245,0.12);
    --glow-pink: rgba(240,122,184,0.12);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* ── Custom Cursor ── */
  #cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: width 0.3s, height 0.3s, opacity 0.3s, background 0.3s;
    mix-blend-mode: difference;
  }
  #cursor-glow {
    position: fixed;
    width: 320px; height: 320px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(180,142,247,0.06) 0%, transparent 70%);
    transition: opacity 0.5s;
  }
  body:hover #cursor { opacity: 1; }

  /* ── Canvas BG ── */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Gradient Mesh ── */
  .mesh {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .mesh-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0;
    animation: meshFloat 0.8s forwards;
  }
  .mesh-blob:nth-child(1) {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(180,142,247,0.18) 0%, transparent 70%);
    top: -200px; left: -150px;
    animation-delay: 0.2s;
  }
  .mesh-blob:nth-child(2) {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(126,179,245,0.14) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    animation-delay: 0.5s;
  }
  .mesh-blob:nth-child(3) {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(240,122,184,0.1) 0%, transparent 70%);
    top: 50%; left: 60%;
    animation-delay: 0.8s;
  }
  @keyframes meshFloat {
    to { opacity: 1; }
  }

  /* ── Layout ── */
  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5rem 2rem;
  }

  /* ── Nav strip ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    animation: fadeUp 1s 0.3s forwards;
  }
  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .nav-tag {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 0.35rem 0.8rem;
    border-radius: 100px;
  }

  /* ── Hero section ── */
  .hero {
    text-align: center;
    max-width: 780px;
    width: 100%;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
  }
  .eyebrow-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 8px var(--purple);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.6rem, 3.8vw, 3rem);
    line-height: 1.18;
    letter-spacing: 0.01em;
    color: var(--text-primary);
    margin-bottom: 1.8rem;
    opacity: 0;
    animation: fadeUp 1.1s 0.8s forwards;
  }
  .headline .wave-word {
    display: inline-block;
    white-space: nowrap;
  }
  .headline .wave-char {
    display: inline-block;
    background: linear-gradient(
      90deg,
      #e8c4f0, #c4b8f5, #a8d4f8, #b8f0e8,
      #f0d4b8, #f5b8c4, #e8c4f0, #c4b8f5
    );
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: waveShift 5s ease-in-out infinite;
  }
  @keyframes waveShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .subtext {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text-secondary);
    font-weight: 300;
    max-width: 520px;
    margin: 0 auto 4rem;
    opacity: 0;
    animation: fadeUp 1s 1s forwards;
  }

  /* ── Glass container ── */
  .glass-container {
    width: 100%;
    max-width: 640px;
    background: rgba(255,255,255,0.025);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 2.8rem;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 1s 1.2s forwards;
  }
  .glass-container::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(180,142,247,0.05) 0%, transparent 50%, rgba(126,179,245,0.05) 100%);
    pointer-events: none;
  }
  .glass-container::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  /* ── Contact cards ── */
  .contact-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1.5rem 1.5rem 1.6rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: border-color 0.4s, background 0.4s, transform 0.3s;
    cursor: none;
  }
  .contact-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .contact-card.email::before {
    background: radial-gradient(ellipse at top left, rgba(180,142,247,0.12), transparent 70%);
  }
  .contact-card.instagram::before {
    background: radial-gradient(ellipse at top left, rgba(240,122,184,0.12), transparent 70%);
  }
  .contact-card:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }
  .contact-card:hover::before { opacity: 1; }

  .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.2rem;
    flex-shrink: 0;
  }
  .email .card-icon { background: rgba(180,142,247,0.15); }
  .instagram .card-icon { background: rgba(240,122,184,0.15); }

  .card-icon svg { width: 18px; height: 18px; }
  .email .card-icon svg { color: var(--purple); }
  .instagram .card-icon svg { color: var(--pink); }

  .card-label {
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .card-value {
    font-size: 0.88rem;
    font-weight: 400;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.4;
  }
  .card-arrow {
    position: absolute;
    bottom: 1.4rem; right: 1.4rem;
    color: var(--text-tertiary);
    transition: color 0.3s, transform 0.3s;
  }
  .contact-card:hover .card-arrow {
    color: var(--text-secondary);
    transform: translate(2px,-2px);
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem 0;
    color: var(--text-tertiary);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Status row ── */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 1.8rem;
    font-size: 0.78rem;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 1s 1.5s forwards;
  }
  .status-indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px rgba(74,222,128,0.5);
    animation: statusPulse 2.5s infinite;
    flex-shrink: 0;
  }
  @keyframes statusPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(74,222,128,0.5); }
    50% { box-shadow: 0 0 18px rgba(74,222,128,0.8), 0 0 32px rgba(74,222,128,0.3); }
  }

  /* ── Footer strip ── */
  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    padding: 1.8rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    animation: fadeUp 1s 1.8s forwards;
  }
  .footer-text {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    letter-spacing: 0.06em;
  }
  .footer-year {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    letter-spacing: 0.06em;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Noise overlay ── */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  /* ── Responsive ── */
  @media (max-width: 560px) {
    .cards-grid { grid-template-columns: 1fr; }
    .glass-container { padding: 1.8rem; border-radius: 20px; }
    .nav, .footer { padding: 1.5rem; }
    .footer-text { display: none; }
  }
</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor"></div>
<div id="cursor-glow"></div>

<!-- Gradient mesh background -->
<div class="mesh">
  <div class="mesh-blob"></div>
  <div class="mesh-blob"></div>
  <div class="mesh-blob"></div>
</div>

<!-- Particle canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Noise overlay -->
<div class="noise"></div>

<!-- Nav -->
<nav class="nav">
  <div class="nav-logo">Sarrthak</div>
  <div class="nav-tag">Contact</div>
</nav>

<!-- Main page -->
<main class="page">
  <div class="hero">

    <div class="eyebrow">
      <div class="eyebrow-dot"></div>
      Open to connections
    </div>

    <h1 class="headline" id="headline">
       Feel free to reach out for collaborations, ideas, projects,<br>or just to say hello!
    </h1>

    

    <div class="glass-container" id="glass">

      <div class="cards-grid">

        <a class="contact-card email magnetic" href="mailto:Sarrthak.chauhan016@nmims.in" target="_blank" rel="noopener">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <path d="m22 7-10 7L2 7"/>
            </svg>
          </div>
          <div class="card-label">Email</div>
          <div class="card-value">Sarrthak.chauhan016<br>@nmims.in</div>
          <div class="card-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M7 17L17 7M17 7H7M17 7v10"/>
            </svg>
          </div>
        </a>

        <a class="contact-card instagram magnetic" href="https://instagram.com/Shady_prodigyy" target="_blank" rel="noopener">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5"/>
              <circle cx="12" cy="12" r="4.5"/>
              <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="card-label">Instagram</div>
          <div class="card-value">@Shady_prodigyy</div>
          <div class="card-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M7 17L17 7M17 7H7M17 7v10"/>
            </svg>
          </div>
        </a>

      </div>

    </div>

    <div class="status-row">
      <div class="status-indicator"></div>
      Available for creative work &amp; collabs
    </div>

  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-text">Built with intention, not templates.</div>
  <div class="footer-year">© 2025</div>
</footer>

<script>
(function(){

  // ── Wave headline: split into per-char spans ──
  (function(){
    const el = document.getElementById('headline');
    if(!el) return;
    const text = el.textContent.trim();
    el.textContent = '';
    const totalChars = text.replace(/ /g,'').length;
    let charIdx = 0;
    text.split(' ').forEach((word, wi) => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'wave-word';
      word.split('').forEach(ch => {
        const s = document.createElement('span');
        s.className = 'wave-char';
        s.textContent = ch;
        // offset each char's background-position phase
        const delay = (charIdx / totalChars) * -5; // negative = pre-offset into the cycle
        const offset = (charIdx / totalChars) * 100;
        s.style.backgroundPosition = offset + '% 50%';
        s.style.animationDelay = delay + 's';
        wordSpan.appendChild(s);
        charIdx++;
      });
      el.appendChild(wordSpan);
      if(wi < text.split(' ').length - 1){
        el.appendChild(document.createTextNode(' '));
      }
    });
  })();

  // ── Cursor ──
  const cursor = document.getElementById('cursor');
  const glow   = document.getElementById('cursor-glow');
  let mx = -300, my = -300;
  let cx = -300, cy = -300;
  let gx = -300, gy = -300;

  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  document.querySelectorAll('a, .magnetic').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.width  = '40px';
      cursor.style.height = '40px';
      cursor.style.background = 'rgba(255,255,255,0.6)';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.width  = '12px';
      cursor.style.height = '12px';
      cursor.style.background = 'rgba(255,255,255,0.9)';
    });
  });

  // Smooth cursor loop
  function animCursor(){
    cx += (mx - cx) * 0.18;
    cy += (my - cy) * 0.18;
    gx += (mx - gx) * 0.07;
    gy += (my - gy) * 0.07;
    cursor.style.left = cx + 'px';
    cursor.style.top  = cy + 'px';
    glow.style.left   = gx + 'px';
    glow.style.top    = gy + 'px';
    requestAnimationFrame(animCursor);
  }
  animCursor();

  // ── Magnetic hover ──
  document.querySelectorAll('.magnetic').forEach(el => {
    let ox = 0, oy = 0;
    el.addEventListener('mousemove', e => {
      const r  = el.getBoundingClientRect();
      const rx = e.clientX - r.left - r.width/2;
      const ry = e.clientY - r.top  - r.height/2;
      const dist = Math.sqrt(rx*rx + ry*ry);
      const strength = Math.max(0, 1 - dist / 120);
      ox = rx * strength * 0.25;
      oy = ry * strength * 0.25;
      el.style.transform = `translate(${ox}px,${oy}px) translateY(-2px)`;
    });
    el.addEventListener('mouseleave', () => {
      el.style.transform = '';
      ox = 0; oy = 0;
    });
  });

  // ── Parallax on mouse ──
  const glass = document.getElementById('glass');
  let px = 0, py = 0;
  document.addEventListener('mousemove', e => {
    const w = window.innerWidth, h = window.innerHeight;
    px = (e.clientX - w/2) / w;
    py = (e.clientY - h/2) / h;
  });
  function animParallax(){
    if(glass){
      const tx = px * 10;
      const ty = py * 6;
      glass.style.transform = `perspective(1000px) rotateY(${tx * 0.3}deg) rotateX(${-ty * 0.3}deg)`;
    }
    requestAnimationFrame(animParallax);
  }
  animParallax();

  // ── Particle canvas ──
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); initParticles(); });

  const COLORS = [
    'rgba(180,142,247,',
    'rgba(126,179,245,',
    'rgba(240,122,184,',
    'rgba(255,255,255,'
  ];

  function initParticles(){
    particles = [];
    const count = Math.min(80, Math.floor(W * H / 14000));
    for(let i = 0; i < count; i++){
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.4,
        vx: (Math.random()-0.5) * 0.25,
        vy: (Math.random()-0.5) * 0.25,
        col: COLORS[Math.floor(Math.random() * COLORS.length)],
        a: Math.random() * 0.5 + 0.1,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.01 + 0.005,
      });
    }
  }
  initParticles();

  function drawParticles(){
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx + px * 0.3;
      p.y += p.vy + py * 0.2;
      p.pulse += p.pulseSpeed;
      const alpha = p.a + Math.sin(p.pulse) * 0.1;
      if(p.x < -10) p.x = W + 10;
      if(p.x > W+10) p.x = -10;
      if(p.y < -10) p.y = H + 10;
      if(p.y > H+10) p.y = -10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.col + Math.min(1, alpha) + ')';
      ctx.fill();
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ── Mesh blobs subtle movement ──
  const blobs = document.querySelectorAll('.mesh-blob');
  let t = 0;
  function animBlobs(){
    t += 0.003;
    blobs.forEach((b, i) => {
      const ox = Math.sin(t + i * 1.3) * 30;
      const oy = Math.cos(t + i * 0.9) * 20;
      b.style.transform = `translate(${ox}px,${oy}px)`;
    });
    requestAnimationFrame(animBlobs);
  }
  animBlobs();

})();
</script>
</body>
</html>
